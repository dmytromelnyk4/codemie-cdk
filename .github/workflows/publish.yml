name: Publish CDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check or publish, for example cdk-v0.2.1'
        type: string
        required: true
      dry_run:
        description: 'Build and check only; do not publish'
        type: boolean
        default: true
      publish:
        description: 'Type "publish" to confirm a real release (also requires dry_run off)'
        type: string
        default: ''

permissions:
  contents: read

# One run per tag. A fixed group would keep only the newest pending run and cancel the ones in between.
concurrency:
  group: publish-cdk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve base version
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'cdk-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/codemie-iac-nodejs
    outputs:
      base-version: ${{ steps.base.outputs.base-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read base version
        id: base
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "base-version=$BASE" >> "$GITHUB_OUTPUT"

  check-version:
    name: Check release version
    needs: [resolve]
    permissions:
      contents: read
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-release-version-check.yml@main
    with:
      ecosystem: npm
      package-name: '@codemieai/cdk'
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      tag-prefix: 'cdk-v'
      base-version: ${{ needs.resolve.outputs.base-version }}

  verify:
    name: Verify and pack
    needs: [check-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/codemie-iac-nodejs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Require main for a real publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish must run from main, not $GITHUB_REF"; exit 1
          fi

      - name: Stamp the version
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          echo "Releasing @codemieai/cdk $VERSION" >> "$GITHUB_STEP_SUMMARY"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The package has no committed lock file; dependencies are always resolved fresh.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report installed codemie-sdk version
        run: echo "codemie-sdk $(node -p "require('./node_modules/codemie-sdk/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: mkdir -p "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack" && cp "$RUNNER_TEMP"/pack/*.tgz "$GITHUB_WORKSPACE/"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdk-package
          path: codemieai-cdk-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [check-version, verify]
    if: >-
      github.event_name == 'release' || (github.event_name == 'workflow_dispatch'
      && inputs.dry_run == false && inputs.publish == 'publish'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-package
          path: package/

      - name: Publish to npm
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          DIST_TAG="latest"
          if [[ "$VERSION" == *-rc* ]]; then
            DIST_TAG="rc"
          fi
          npm publish ./package/codemieai-cdk-*.tgz --access public --tag "$DIST_TAG"

